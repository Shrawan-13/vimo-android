name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_native:
        description: "Build the native libraries from the core instead of downloading them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the XDG base directories
        shell: bash
        run: |
          # Everything that is a cache lives under one predictable root
          # instead of a dot-folder in the home directory.
          export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$XDG_CACHE_HOME/gradle" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      # The Gradle user home holds the dependency cache, the build cache and
      # the downloaded native libraries. Restoring it is what makes the build
      # fast; it is the single biggest lever in this workflow.
      - name: Cache the Gradle user home
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
            ${{ env.XDG_CACHE_HOME }}/vimo-native
          key: gradle-home-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-home-${{ runner.os }}-

      - name: Cache the build directory
        uses: actions/cache@v6
        with:
          path: app/build
          key: app-build-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.gradle.kts') }}
          restore-keys: |
            app-build-${{ runner.os }}-

      # When the native artifact cannot be downloaded (for example before the
      # first release), it is built from the core instead.
      - name: Check out the core
        if: ${{ inputs.build_native == true }}
        uses: actions/checkout@v7
        with:
          repository: Shrawan-13/vimo-core
          path: ../vimo

      - name: Set up Rust
        if: ${{ inputs.build_native == true }}
        uses: dtolnay/rust-toolchain@stable

      - name: Set up the NDK
        if: ${{ inputs.build_native == true }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        if: ${{ inputs.build_native == true }}
        uses: taiki-e/install-action@cargo-ndk

      - name: Build the debug APK
        run: |
          if [ "${{ inputs.build_native }}" = "true" ]; then
            gradle --build-cache --configuration-cache --parallel \
              -Pvimo.native.local=true \
              :app:assembleDebug
          else
            gradle --build-cache --configuration-cache --parallel :app:assembleDebug
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: vimo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vimo-test-report
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  prune-caches:
    name: Prune old Actions caches
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # Keep the cache count bounded: the twenty newest are almost always the
      # useful ones, and an unbounded cache eventually fills the runner's disk.
      - name: Keep the 20 newest repository caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t stale_ids < <(
            gh api --paginate "repos/${REPOSITORY}/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id, .created_at] | @tsv' \
              | sort -k2,2r \
              | awk 'NR > 20 { print $1 }'
          )
          for cache_id in "${stale_ids[@]}"; do
            gh api --silent --method DELETE "repos/${REPOSITORY}/actions/caches/${cache_id}"
          done
