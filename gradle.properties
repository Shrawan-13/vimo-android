org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Where the Rust core is checked out. The CI workflow clones it there before
# the build; a local checkout uses the same layout.
vimo.core.dir=../vimo

# The Rust target ABIs that are built into the APK.
vimo.abis=arm64-v8a,x86_64
