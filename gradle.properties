# The Gradle JVM's memory. The editor's timeline is drawn on a canvas, so
# the build itself is light, but the Kotlin compiler likes some room.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The Android Gradle Plugin's namespace and build features.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The version of the native libraries that are downloaded from the core
# repository's releases. Bump this when a new core release is published.
#
# The version is part of the name of the artifact, so a new version is also
# a new download: the cache can never hand out the libraries of an older
# release.
vimo.native.version=0.1.3

# The repository the native libraries are downloaded from.
vimo.core.repo=Shrawan-13/vimo-core

# The SHA-256 of the native artifact, pinned. The build refuses to package
# anything else, so a cache that holds the libraries of an older release
# cannot slip in.
vimo.native.sha256=53fb80e819962e8de6ae5133508799eb1ea63ed7bdae600fde609fccab79d531

# Set this to true to build the native libraries from a local checkout of the
# core instead of downloading them. Useful while working on the core.
vimo.native.local=false

# Where the core is checked out, when building locally.
vimo.core.dir=../vimo
